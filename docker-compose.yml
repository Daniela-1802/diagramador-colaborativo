version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: diagramador
      POSTGRES_PASSWORD: diagramador123
      POSTGRES_DB: diagramador_colaborativo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://diagramador:diagramador123@db:5432/diagramador_colaborativo
      JWT_SECRET: secreto-dev-cambiar-en-produccion
      PORT: 3000
    env_file: 
      - ./backend/.env
    volumes:
      - ./backend/prisma:/app/prisma
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

volumes:
  pgdata:
